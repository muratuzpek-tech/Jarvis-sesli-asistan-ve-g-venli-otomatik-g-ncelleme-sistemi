name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    # Windows testleri henuz tam uyumlu degil (masaustu yolu onbellegi, yol
    # ayraclari); sonuc gorunur kalir ama ana kontrolu kirmizi yapmaz.
    # Windows uyumlulugu ayri bir is olarak yapilinca bu satir kaldirilacak.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux runtime libs (PortAudio + Qt headless)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libportaudio2 libegl1 libxkbcommon0 libdbus-1-3 bubblewrap

      - name: Start headless PulseAudio (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=jarvis_ci
          pactl set-default-sink jarvis_ci
          pactl set-default-source jarvis_ci.monitor
          server_string="$(pactl info | sed -n 's/^Server String: //p')"
          test -n "$server_string"
          case "$server_string" in
            /*) echo "PULSE_SERVER=unix:$server_string" >> "$GITHUB_ENV" ;;
            *) echo "PULSE_SERVER=$server_string" >> "$GITHUB_ENV" ;;
          esac
          echo "PulseAudio server exported for subsequent steps: $server_string"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run full tests (Linux)
        if: runner.os == 'Linux'
        run: pytest
        env:
          JARVIS_HOME: ${{ runner.temp }}/jarvis_ci_home
          JARVIS_SANDBOX: off

      - name: Windows import and collection smoke
        if: runner.os == 'Windows'
        run: |
          python -m compileall -q src/jarvis scripts
          python -c "import runpy; ns=runpy.run_path('scripts/self_dev.py'); assert ns['fcntl'] is None; print('Windows import OK')"
          python -m pytest --collect-only -q tests/test_self_dev.py
