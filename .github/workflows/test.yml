name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux runtime libs (PortAudio + Qt headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libportaudio2 libegl1 libxkbcommon0 libdbus-1-3 bubblewrap

      - name: Start headless PulseAudio
        shell: bash
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=jarvis_ci
          pactl set-default-sink jarvis_ci
          pactl set-default-source jarvis_ci.monitor
          server_string="$(pactl info | sed -n 's/^Server String: //p')"
          test -n "$server_string"
          case "$server_string" in
            /*) echo "PULSE_SERVER=unix:$server_string" >> "$GITHUB_ENV" ;;
            *) echo "PULSE_SERVER=$server_string" >> "$GITHUB_ENV" ;;
          esac
          echo "PulseAudio server exported for subsequent steps: $server_string"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run full tests
        run: pytest
        env:
          JARVIS_HOME: ${{ runner.temp }}/jarvis_ci_home
          JARVIS_SANDBOX: off
