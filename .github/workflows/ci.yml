name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sistem bağımlılıkları (PortAudio + Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libportaudio2 libegl1 libgl1 libxkbcommon0 libdbus-1-3 bubblewrap
      - name: Başsız PulseAudio sunucusunu başlat
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=jarvis_ci
          pactl set-default-sink jarvis_ci
          pactl set-default-source jarvis_ci.monitor
          server_string="$(pactl info | sed -n 's/^Server String: //p')"
          test -n "$server_string"
          case "$server_string" in
            /*) echo "PULSE_SERVER=unix:$server_string" >> "$GITHUB_ENV" ;;
            *) echo "PULSE_SERVER=$server_string" >> "$GITHUB_ENV" ;;
          esac
          echo "PulseAudio server exported for subsequent steps: $server_string"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q src/jarvis
      - env:
          QT_QPA_PLATFORM: offscreen
          JARVIS_SANDBOX: off
        run: pytest

  audit:
    # Bağımlılıklardaki bilinen güvenlik açıkları. İlk aşamada ENGELLEMEZ
    # (continue-on-error): bulgular önce tek tek incelenecek (doğrudan mı,
    # dolaylı mı, çalışmayı etkiliyor mu) — paketler körlemesine yükseltilmez.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip install -e .
      - name: pip-audit
        run: pip-audit --progress-spinner off --desc on

  semgrep:
    # Ek statik güvenlik taraması (Semgrep CE, ücretsiz). İlk aşamada yalnız
    # UYARI verir (continue-on-error): bulgular birkaç tur incelenip yalancı
    # alarmlar ayıklandıktan sonra güvenilir kurallar engelleyici yapılabilir.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip semgrep
      - name: semgrep (python + güvenlik kuralları)
        run: semgrep scan --config p/python --config p/security-audit --metrics off --error src scripts
