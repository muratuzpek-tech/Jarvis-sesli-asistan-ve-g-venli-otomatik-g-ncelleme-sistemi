name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sistem bağımlılıkları (PortAudio + Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q src/jarvis
      - env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

  audit:
    # Bağımlılıklardaki bilinen güvenlik açıkları. İlk aşamada ENGELLEMEZ
    # (continue-on-error): bulgular önce tek tek incelenecek (doğrudan mı,
    # dolaylı mı, çalışmayı etkiliyor mu) — paketler körlemesine yükseltilmez.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip install -e .
      - name: pip-audit
        run: pip-audit --progress-spinner off --desc on
