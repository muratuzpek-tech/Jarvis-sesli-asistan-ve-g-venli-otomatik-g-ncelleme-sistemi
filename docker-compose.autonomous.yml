services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    gpus: all

  jarvis-agent:
    build:
      context: .
      dockerfile: docker/autonomous/Dockerfile
    profiles: ["job"]
    depends_on:
      - ollama
    environment:
      HOME: /workhome
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CODER_MODEL: ${OLLAMA_CODER_MODEL:-qwen2.5-coder:14b}
      JARVIS_OLLAMA_NUM_CTX: ${JARVIS_OLLAMA_NUM_CTX:-4096}
      JARVIS_MAX_ATTEMPTS: ${JARVIS_MAX_ATTEMPTS:-5}
      JARVIS_MAX_MINUTES: ${JARVIS_MAX_MINUTES:-60}
      JARVIS_VERIFY_COMMANDS: ${JARVIS_VERIFY_COMMANDS:-python -m pytest;ruff check .}
      JARVIS_REPO: /repo
    volumes:
      # Worktree metadata and the final fast-forward merge require Git write access.
      # The supervisor still refuses dirty trees and never edits outside its worktree.
      - .:/repo
      - jarvis-jobs:/workhome/jobs
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ollama-data:
  jarvis-jobs:
