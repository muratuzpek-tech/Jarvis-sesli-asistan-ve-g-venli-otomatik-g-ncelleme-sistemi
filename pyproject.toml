[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "murat-jarvis"
version = "25.1.0"
description = "MuratJARVIS — Gemini Live tabanlı, çok beyinli kişisel masaüstü asistanı"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Murat Uzpek" }]

# NOT: Kod asyncio.TaskGroup ve "except*" (PEP 654) kullanıyor -> Python 3.11 ALT SINIRDIR.
# 3.13 ile PyQt6/sounddevice kombinasyonu doğrulanmadığı için üst sınır <3.14.
dependencies = [
    "sounddevice>=0.4.6",
    "google-genai>=1.0",
    "google-generativeai>=0.8",
    "pillow>=10.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "playwright>=1.44",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "pygetwindow>=0.0.9",
    "opencv-python>=4.9",
    # numpy 2.5, sounddevice'ın gerçek zamanlı ses callback'inde susturulamayan bir
    # DeprecationWarning tetikliyor ("ses bazen gelmiyor" şikâyetinin kök nedeni).
    "numpy>=1.26,<2.5",
    "mss>=9.0",
    "psutil>=5.9",
    "send2trash>=1.8",
    "youtube-transcript-api>=0.6",
    "python-pptx>=0.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "qrcode[pil]>=7.4",
    "jc>=1.25",
    "PyQt6>=6.6",
    "comtypes>=1.2; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "win10toast>=0.9; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
jarvis = "jarvis.__main__:main"
jarvis-cli = "jarvis.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = [
    "assets/*",
    "config/*.ico",
    "config/*.example.json",
    "core/prompt.txt",
    "dashboard/static/*",
    "memory/README.txt",
    "self_improvement/**/.gitkeep",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["developer_archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "S102", "S105", "S106", "S307", "S602", "S605"]
# E501/E701/E702: devralınan kod yoğun tek satır stili kullanıyor; toplu yeniden
# biçimlendirme gerçek hataları gözden kaçırır. E402: birkaç modül PyQt/ortam
# kurulumunu import'lardan önce yapmak zorunda.
ignore = ["E501", "E701", "E702", "E402", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/manual: elle çalıştırılan GUI/kurulum dumanı testleri (CI'da toplanmaz)
norecursedirs = ["manual", "developer_archive"]
